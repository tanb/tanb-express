<div class="tw-bg-white tw-p-[24px]">
  <div class="modal-header">
    <div class="tw-mx-auto tw-aspect-square tw-w-[30px]">
      <img class="tw-object-contain" src="/assets/icons/icon.svg" alt="logo" />
    </div>

    <div class="tw-text-xl">Contact Tomonori Tanabe</div>
  </div>
  <div class="modal-body">
    <form [formGroup]="formGroup">
      <div class="tw-my-[16px]">
        <input
          data-1p-ignore
          class="tw-w-full tw-rounded tw-border tw-border-solid tw-border-[#E3E3E3] tw-px-4 tw-py-2"
          formControlName="name"
          type="text"
          id="name"
          placeholder="{{ 'Your name' | translate }}"
        />
        <div
          class="tw-text-right tw-text-xs tw-text-[#EA5DAD]"
          *ngIf="formGroup.get('name')?.errors && !!(formGroup.get('name')?.errors)!['required']"
          translate
        >
          Required
        </div>
        <div class="error text-right" *ngIf="formGroup.get('name')?.errors && (formGroup.get('name')?.errors)!['maxlength']" translate>
          Cannot be more than 30 characters long
        </div>
      </div>
      <div class="tw-my-[16px]">
        <input
          data-1p-ignore
          class="tw-w-full tw-rounded tw-border tw-border-solid tw-border-[#E3E3E3] tw-px-4 tw-py-2"
          formControlName="email"
          type="email"
          id="email"
          placeholder="{{ 'Your email address' | translate }}"
        />
        <div
          class="tw-text-right tw-text-xs tw-text-[#EA5DAD]"
          *ngIf="formGroup.get('email')?.errors && (formGroup.get('email')?.errors)!['required']"
          translate
        >
          Required
        </div>
        <div
          class="tw-text-right tw-text-xs tw-text-[#EA5DAD]"
          *ngIf="formGroup.get('email')?.errors && (formGroup.get('email')?.errors)!['email']"
          translate
        >
          Enter a valid email
        </div>
      </div>
      <div class="tw-my-[16px]">
        <textarea
          data-1p-ignore
          class="tw-w-full tw-rounded tw-border tw-border-solid tw-border-[#E3E3E3] tw-px-4 tw-py-2"
          formControlName="message"
          id="message"
          rows="10"
          placeholder="{{ 'Type your message here...' | translate }}"
        ></textarea>
        <div
          class="tw-text-right tw-text-xs tw-text-[#EA5DAD]"
          *ngIf="formGroup.get('message')?.errors && (formGroup.get('message')?.errors)!['required']"
          translate
        >
          Required
        </div>
        <div
          class="tw-text-right tw-text-xs tw-text-[#EA5DAD]"
          *ngIf="formGroup.get('message')?.errors && (formGroup.get('message')?.errors)!['maxlength']"
          translate
        >
          Cannot be more than 2000 characters long
        </div>
      </div>
      <div class="recaptcha tw-my-[16px]">
        <app-recaptcha [siteKey]="data.siteKey ?? ''" formControlName="recaptchaReactive"></app-recaptcha>
      </div>
    </form>
  </div>

  <div class="modal-footer">
    <div class="container">
      <div *ngIf="!completed">
        <div *ngIf="hasError">
          <div class="alert alert-danger" role="alert"><strong>Oops!</strong> An unexpected error occurred.</div>
        </div>
        <div class="tw-flex tw-justify-end">
          <app-button (click)="onClose()"><span translate>Cancel</span></app-button>
          <app-button [disabled]="formGroup.invalid" (click)="submitForm()"><span translate>Send</span></app-button>
        </div>
      </div>
      <div class="tw-flex" *ngIf="completed">
        <div class="alert alert-success" role="alert"><strong>Success!</strong> Thank you!</div>

        <button type="button" class="btn btn-light" (click)="onClose()">Close</button>
      </div>
    </div>
  </div>
</div>
